name: Build Smart Chef APK from ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK from ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "Files in repository root:"
          ls -la
          echo ""
          echo "ZIP files found:"
          find . -maxdepth 2 -type f -iname "*.zip" -print

      - name: Locate and unzip SmartChef project
        run: |
          set -e

          ZIP_FILE=""

          if [ -f "SmartChef_Android_GitHub_Actions_Ready.zip" ]; then
            ZIP_FILE="SmartChef_Android_GitHub_Actions_Ready.zip"
          else
            ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*SmartChef*.zip" | head -n 1 || true)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No SmartChef ZIP file found."
            echo "Upload SmartChef_Android_GitHub_Actions_Ready.zip to the repository root."
            exit 1
          fi

          echo "Using ZIP file: $ZIP_FILE"

          rm -rf extracted_project
          mkdir extracted_project
          unzip -q "$ZIP_FILE" -d extracted_project

          echo "Extracted structure:"
          find extracted_project -maxdepth 4 -type d | sed 's#^#DIR: #'

          PROJECT_DIR=$(find extracted_project -type f -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs dirname || true)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find extracted_project -type f -name "gradlew" | head -n 1 | xargs dirname || true)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find Android project inside ZIP."
            echo "The ZIP must contain gradlew, settings.gradle, and app folder."
            exit 1
          fi

          echo "Android project directory: $PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. .

          echo "Repository root after copying project:"
          ls -la

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew not found after extraction."
            exit 1
          fi

          if [ ! -d "./app" ]; then
            echo "ERROR: app folder not found after extraction."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartChef-V18-backend-cloud-vision-apk
          path: app/build/outputs/apk/debug/*.apk
