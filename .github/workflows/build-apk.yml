name: Build Smart Chef APK from ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip SmartChef project
        run: |
          ZIP_FILE="SmartChef_Android_GitHub_Actions_Ready.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: SmartChef_Android_GitHub_Actions_Ready.zip not found in repository root."
            echo "Current files:"
            ls -la
            exit 1
          fi

          rm -rf extracted_project
          mkdir extracted_project
          unzip -q "$ZIP_FILE" -d extracted_project

          echo "Extracted folders:"
          find extracted_project -maxdepth 3 -type d

          if [ -d "extracted_project/app" ]; then
            cp -r extracted_project/* .
          else
            PROJECT_DIR=$(find extracted_project -maxdepth 3 -type d -name app | head -n 1 | xargs dirname)
            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: app folder not found inside ZIP."
              exit 1
            fi
            cp -r "$PROJECT_DIR"/* .
          fi

          echo "Root files after copy:"
          ls -la

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartChef-V18-backend-cloud-vision-apk
          path: app/build/outputs/apk/debug/*.apk
